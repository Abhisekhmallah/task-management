
name: Task Management CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    # Start PostgreSQL database for CI
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: task_management
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d task_management"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Environment variables for Spring Boot
    env:
      DB_URL: jdbc:postgresql://localhost:5432/task_management
      DB_USERNAME: postgres
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}

    permissions:
      contents: read

    steps:
      # Step 1: Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      # Step 3: Give Gradle wrapper execute permission
      - name: Grant Gradle permission
        run: chmod +x gradlew

      # Step 4: Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Step 5: Build and run tests
      - name: Clean and Build
        run: ./gradlew clean build

  dependency-submission:
    name: Dependency Submission
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@v4
